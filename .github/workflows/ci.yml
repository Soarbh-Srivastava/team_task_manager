name: CI and Railway Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: railway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm run test:coverage

  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm run test

  deploy-backend:
    name: Deploy backend to Railway
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: backend
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
      RAILWAY_HEALTHCHECK_URL: ${{ secrets.RAILWAY_HEALTHCHECK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service "$RAILWAY_SERVICE_ID" --detach

      - name: Check deployed health endpoint
        run: |
          if [ -z "$RAILWAY_HEALTHCHECK_URL" ]; then
            echo "RAILWAY_HEALTHCHECK_URL secret is required for the deployment health check."
            exit 1
          fi

          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors --retry-connrefused "$RAILWAY_HEALTHCHECK_URL/health"

  deploy-frontend:
    name: Deploy frontend to Railway
    runs-on: ubuntu-latest
    needs:
      - frontend
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: frontend
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_FRONTEND_SERVICE_ID }}
      RAILWAY_HEALTHCHECK_URL: ${{ secrets.RAILWAY_FRONTEND_HEALTHCHECK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy frontend to Railway
        run: railway up --service "$RAILWAY_SERVICE_ID" --detach

      - name: Check deployed frontend
        run: |
          if [ -z "$RAILWAY_HEALTHCHECK_URL" ]; then
            echo "RAILWAY_FRONTEND_HEALTHCHECK_URL secret is required for the frontend health check."
            exit 1
          fi

          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors --retry-connrefused "$RAILWAY_HEALTHCHECK_URL/"